apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webhooklite-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/cooler-sai/webhooklite.git'
    path: deploy
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: webhook-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true