apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: webhooklite-validation
webhooks:
  - name: validate.webhooklite.local
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
    clientConfig:
      service:
        name: webhooklite
        namespace: default
        path: "/validate"
        port: 8443
      caBundle: " "
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5