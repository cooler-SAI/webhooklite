apiVersion: v1
kind: Service
metadata:
  name: webhooklite
  namespace: default
spec:
  ports:
    - port: 443
      targetPort: 8443
  selector:
    app: webhooklite
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhooklite
  namespace: default
  labels:
    app: webhooklite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhooklite
  template:
    metadata:
      labels:
        app: webhooklite
    spec:
      # IMPORTANT! Try to run on Control Plane
      # nodeSelector:
      #  kubernetes.io/hostname: k8s-sec-lab-control-plane
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # --------------------------------------------------
      containers:
        - name: webhooklite
          image: ghcr.io/cooler-sai/webhooklite:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          ports:
            - containerPort: 8443
          # Health probes for Kubernetes
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: webhooklite-certs