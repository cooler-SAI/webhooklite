apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name | default "webhook-service" }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.appName | default "webhook" }}
    {{- include "webhooklite.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.appName | default "webhook" }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: {{ .Values.service.protocol | default "TCP" }}
  type: {{ .Values.service.type | default "ClusterIP" }}