apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default "webhook-sa" }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "webhooklite.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.clusterRole.name | default "webhook-role" }}
  labels:
    {{- include "webhooklite.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: {{ .Values.clusterRole.rules.pods.verbs | default "[\"get\", \"list\", \"watch\"]" }}
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: {{ .Values.clusterRole.rules.webhookconfigs.verbs | default "[\"get\", \"list\", \"watch\", \"update\"]" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.clusterRoleBinding.name | default "webhook-binding" }}
  labels:
    {{- include "webhooklite.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default "webhook-sa" }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.clusterRole.name | default "webhook-role" }}
  apiGroup: rbac.authorization.k8s.io